syntax = "proto3";

option csharp_namespace = "PRN232.LMS.StudentService.Protos";

package student;

service StudentGrpc {
  rpc GetStudentById (GetStudentRequest) returns (StudentResponseGrpc);
  rpc GetStudents (GetStudentsRequest) returns (GetStudentsResponse);
}

message GetStudentRequest {
  int32 student_id = 1;
}

message StudentResponseGrpc {
  int32 student_id = 1;
  string full_name = 2;
  string email = 3;
  string date_of_birth = 4; // ISO format string
  string student_code = 5;
}

message GetStudentsRequest {
  repeated int32 student_ids = 1;
}

message GetStudentsResponse {
  repeated StudentResponseGrpc students = 1;
}
