syntax = "proto3";

option csharp_namespace = "PRN232.LMS.StudentService.Protos";

package course;

service CourseGrpc {
  rpc GetEnrollmentsByStudentId (GetEnrollmentsRequest) returns (GetEnrollmentsResponse);
  rpc GetCoursesByStudentId (GetCoursesRequest) returns (GetCoursesResponse);
}

message GetEnrollmentsRequest {
  int32 student_id = 1;
  string search = 2;
  string sort = 3;
  int32 page = 4;
  int32 size = 5;
  string expand = 6;
}

message EnrollmentGrpcDto {
  int32 enrollment_id = 1;
  int32 student_id = 2;
  int32 course_id = 3;
  string enroll_date = 4;
  string status = 5;
  CourseGrpcDto course = 6;
}

message CourseGrpcDto {
  int32 course_id = 1;
  string course_name = 2;
  int32 semester_id = 3;
  int32 subject_id = 4;
  SemesterGrpcDto semester = 5;
  SubjectGrpcDto subject = 6;
}

message SemesterGrpcDto {
  int32 semester_id = 1;
  string semester_name = 2;
  string start_date = 3;
  string end_date = 4;
}

message SubjectGrpcDto {
  int32 subject_id = 1;
  string subject_code = 2;
  string subject_name = 3;
  int32 credit = 4;
}

message GetEnrollmentsResponse {
  repeated EnrollmentGrpcDto items = 1;
  int32 total_items = 2;
  int32 page = 3;
  int32 size = 4;
}

message GetCoursesRequest {
  int32 student_id = 1;
  string search = 2;
  string sort = 3;
  int32 page = 4;
  int32 size = 5;
  string expand = 6;
}

message GetCoursesResponse {
  repeated CourseGrpcDto items = 1;
  int32 total_items = 2;
  int32 page = 3;
  int32 size = 4;
}
