services:

  prn232.lms.api:
    build:
      context: .
      dockerfile: PRN232.LMS.API/Dockerfile

    ports:
      - "5001:8080"

    depends_on:
      - sqlserver

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sqlserver;Database=LMSDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"

    ports:
      - "1434:1433"