services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  student-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1436:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  course-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1437:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build:
      context: .
      dockerfile: PRN232.LMS.IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=identity-db;Database=IdentityDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True
      - Jwt__Key=PRN232-LMS-SuperSecretKey-ChangeInProduction-AtLeast32Chars!
      - Jwt__Issuer=PRN232.LMS.API
      - Jwt__Audience=PRN232.LMS.Client
    depends_on:
      identity-db:
        condition: service_healthy

  student-service:
    build:
      context: .
      dockerfile: PRN232.LMS.StudentService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=student-db;Database=StudentDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True
      - Jwt__Key=PRN232-LMS-SuperSecretKey-ChangeInProduction-AtLeast32Chars!
      - Jwt__Issuer=PRN232.LMS.API
      - Jwt__Audience=PRN232.LMS.Client
      - GrpcClients__CourseService=http://course-service:8080
    depends_on:
      student-db:
        condition: service_healthy

  course-service:
    build:
      context: .
      dockerfile: PRN232.LMS.CourseService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=course-db;Database=CourseDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True
      - Jwt__Key=PRN232-LMS-SuperSecretKey-ChangeInProduction-AtLeast32Chars!
      - Jwt__Issuer=PRN232.LMS.API
      - Jwt__Audience=PRN232.LMS.Client
      - GrpcClients__StudentService=http://student-service:8080
    depends_on:
      course-db:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: PRN232.LMS.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=PRN232-LMS-SuperSecretKey-ChangeInProduction-AtLeast32Chars!
      - Jwt__Issuer=PRN232.LMS.API
      - Jwt__Audience=PRN232.LMS.Client
    depends_on:
      - identity-service
      - student-service
      - course-service